<body class="is-loading">
  <div class="preloader" id="preloader" aria-hidden="true">

          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="hero__pin">
        <video class="hero__video" id="heroVideo" muted playsinline autoplay loop preload="auto" poster="assets/hero-poster.jpg">

        </video>
        <div class="hero__overlay"></div>
        <div class="hero__content wrap">
          <p class="eyebrow hero__tag" data-t="heroEyebrow"></p>

          <p class="lede hero__sub" data-t="heroLede"></p>
          <div class="hero-cta hero__cta">
            <a class="btn primary" href="#participar" data-t="ctaParticipate"></a>
            <a class="btn ghost" href="#centro" data-t="ctaCenter"></a>
          </div>
        </div>
        <div class="hero__scroll-indicator">
          <span data-t="scrollHint"></span>
          <div class="hero__scroll-line"></div>
        </div>
      </div>

      <p class="section-intro" data-t="audIntro"></p>
      <div class="cards" id="audience-cards"></div>
    </section>

    <section class="section wrap" id="participar">
      <h2 data-t="partTitle"></h2>
      <div class="split">
        <article class="panel">
          <h3 data-t="partAdultsTitle"></h3>
          <div class="prose" data-t-html="partAdults"></div>

        <article class="panel accent">
